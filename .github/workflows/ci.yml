name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '16.1'
  CMAKE_VERSION: '3.28'

jobs:
  nsid-constants-drift-check:
    name: NSID Constants Drift Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Raw NSID Registration Literal Lint
        run: deno test packages/narzedzia/nsid_registration_literal_check_test.ts

      - name: Check Raw NSID Registration Literals
        run: deno run --allow-read packages/narzedzia/nsid_registration_literal_check.ts .

      - name: Check NSID Constants Drift
        run: deno run -A scripts/generate_nsid_constants.ts --check

      - name: Check Skill Index Drift
        run: deno run -A scripts/dev/generate_skill_index.ts --check

      - name: Check Codex Agent Role Manifests
        run: deno run -A scripts/dev/check_codex_agent_roles.ts

  macos-build-and-test:
    name: macOS Build & Test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/ninja
            /usr/local/Cellar/cmake
          key: macos-brew-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            macos-brew-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/CMakeCache.txt
            build/CMakeFiles
          key: macos-cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            macos-cmake-${{ runner.os }}-

      - name: Install Build Dependencies
        run: |
          brew update
          brew install ninja cmake ccache || true

      - name: Check XRPC Registry Coverage
        run: |
          node scripts/docs/generate_xrpc_coverage_report.cjs --source-only --fail-on-duplicates

      - name: Check Recursive Objective-C Setters
        run: |
          ./scripts/check-recursive-setters.sh

      - name: Check No Host-Process exit()/abort() (M7)
        run: |
          ./scripts/check_no_host_process_exit.sh

      - name: Check Module Boundaries
        run: |
          ./scripts/dev/check_module_boundaries.sh .

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DBUILD_SECP256K1=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_FUZZERS=OFF

      - name: Build
        run: |
          cmake --build build --parallel 4 --target kaszlak AllTests

      - name: Check Module Boundaries (Link-Time)
        run: |
          ./scripts/check_module_boundaries.sh build

      - name: Check Symbol Namespace (M5)
        run: |
          ./scripts/check_namespace.sh build

      - name: Run §1.5 DAG-CBOR strict gate
        run: |
          cmake --build build --target test_dagcbor_strict

      - name: Run Tests
        run: |
          # Sharded AllTests under ctest -j (workstream 09 T6). Exclude the
          # unsharded AllTests entry so the suite is not run twice.
          ctest --test-dir build --output-on-failure -j4 -E '^AllTests$'

  linux-gnustep-build-and-test:
    name: Linux GNUstep Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt
          key: linux-apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            linux-apt-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build-linux/_deps
            build-linux/CMakeCache.txt
            build-linux/CMakeFiles
          key: linux-cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            linux-cmake-${{ runner.os }}-

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            ccache \
            gnustep-make \
            libgnustep-base-dev \
            libblocksruntime-dev \
            libssl-dev \
            libsqlite3-dev \
            libqrencode-dev

      - name: Check Module Boundaries
        run: |
          ./scripts/dev/check_module_boundaries.sh .

      - name: Configure (GNUstep CMake)
        run: |
          # Do not pass -DCMAKE_{C,CXX,OBJC}_COMPILER here: CMakeLists.txt's
          # pre-project() block already resolves and sets them on Linux via
          # find_program(), to an absolute path (e.g. /bin/clang). Passing
          # the unqualified names here too creates a cache entry that never
          # textually matches what the pre-project block sets, which CMake
          # treats as "compiler changed" on every internal reconfigure --
          # deleting the cache and restarting configure from scratch,
          # forever, within a single `cmake` invocation.
          cmake -S . -B build-linux \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DBUILD_SECP256K1=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_FUZZERS=OFF

      - name: Build (GNUstep)
        run: |
          cmake --build build-linux --parallel 4 --target kaszlak AllTests

      - name: Check Module Boundaries (Link-Time, GNUstep)
        run: |
          ./scripts/check_module_boundaries.sh build-linux

      - name: Run §1.5 DAG-CBOR strict gate (GNUstep)
        run: |
          cmake --build build-linux --target test_dagcbor_strict

      - name: Run Tests (GNUstep)
        run: |
          ctest --test-dir build-linux --output-on-failure -j4 -E '^AllTests$'

  linux-docker-build:
    name: Linux Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.gnustep
          push: false
          tags: atprotopds:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # plc-integration-tests removed (workstream 09 T7): it rebuilt the full
  # macOS tree then ran `ctest -R "PLC|DID|Identity"`, which matches no
  # registered ctest name (only `AllTests` is registered). PLC coverage
  # already runs inside macos-build-and-test's AllTests --gated=run.

  pty-sidecar-tests:
    name: PTY Sidecar Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/mcp-pty/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pty-sidecar-cargo-${{ runner.os }}-${{ hashFiles('scripts/mcp-pty-rs/Cargo.lock') }}
          restore-keys: |
            pty-sidecar-cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: scripts/mcp-pty/node_modules
          key: pty-sidecar-npm-${{ runner.os }}-${{ hashFiles('scripts/mcp-pty/package-lock.json') }}
          restore-keys: |
            pty-sidecar-npm-${{ runner.os }}-

      - name: Build sidecar binary
        run: cargo build --manifest-path scripts/mcp-pty-rs/Cargo.toml

      - name: Run Rust sidecar tests
        run: cargo test --manifest-path scripts/mcp-pty-rs/Cargo.toml

      - name: Install npm dependencies
        working-directory: scripts/mcp-pty
        run: npm ci

      - name: Run sidecar tests
        working-directory: scripts/mcp-pty
        run: |
          node --test --test-timeout=30000 \
            test/sidecar_test.mjs \
            test/sidecar_corpus_test.mjs \
            test/snapshot_compare_test.mjs

      - name: Run sidecar smoke test (/bin/cat)
        working-directory: scripts/mcp-pty
        run: |
          node corpus/runner.mjs tests/cat.yaml --sidecar --continue-on-failure
