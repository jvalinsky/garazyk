name: Admin UI Smoke

# Path-filtered + manual. Keeps the heavy Playwright/Chromium visual smoke off
# the default every-PR macOS AllTests job while still gating Admin UI / kaszlak
# embed changes (WS11 M4 acceptance item 6 / PDS brief open item 3).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Garazyk/Sources/AdminUIServer/**"
      - "Garazyk/Sources/Admin/AdminUI/**"
      - "Garazyk/Binaries/kaszlak/**"
      - "Garazyk/Sources/CLI/PDSAdminUIBootstrap.h"
      - "Garazyk/Sources/CLI/PDSAdminUIBootstrapStub.m"
      - "Garazyk/Sources/CLI/PDSCLIServeCommand.m"
      - "scripts/admin_ui_visual_smoke_test.ts"
      - "scripts/admin_ui_browser_smoke_test.ts"
      - ".github/workflows/admin-ui-smoke.yml"
  push:
    branches: [main]
    paths:
      - "Garazyk/Sources/AdminUIServer/**"
      - "Garazyk/Sources/Admin/AdminUI/**"
      - "Garazyk/Binaries/kaszlak/**"
      - "Garazyk/Sources/CLI/PDSAdminUIBootstrap.h"
      - "Garazyk/Sources/CLI/PDSAdminUIBootstrapStub.m"
      - "Garazyk/Sources/CLI/PDSCLIServeCommand.m"
      - "scripts/admin_ui_visual_smoke_test.ts"
      - "scripts/admin_ui_browser_smoke_test.ts"
      - ".github/workflows/admin-ui-smoke.yml"

concurrency:
  group: admin-ui-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.1"

jobs:
  visual-smoke:
    name: PDS Admin UI Visual Smoke
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/ninja
            /usr/local/Cellar/cmake
          key: macos-brew-admin-ui-${{ runner.os }}-${{ hashFiles('.github/workflows/admin-ui-smoke.yml') }}
          restore-keys: |
            macos-brew-admin-ui-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/CMakeCache.txt
            build/CMakeFiles
          key: macos-cmake-admin-ui-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cmake/**/*.cmake', '.github/workflows/admin-ui-smoke.yml') }}
          restore-keys: |
            macos-cmake-admin-ui-${{ runner.os }}-

      - name: Install Build Dependencies
        run: |
          brew update
          brew install ninja cmake ccache || true

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DBUILD_SECP256K1=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_FUZZERS=OFF

      - name: Build kaszlak
        run: cmake --build build --parallel 4 --target kaszlak

      - name: Install Playwright Chromium
        run: deno run -A npm:playwright@1.52.0 install chromium

      - name: Run visual smoke
        run: deno run -A scripts/admin_ui_visual_smoke_test.ts
