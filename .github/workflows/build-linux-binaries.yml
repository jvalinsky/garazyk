name: Build Linux Binaries

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build against the supported GNUstep runtime
        run: |
          docker build \
            --file docker/Dockerfile.gnustep \
            --target builder \
            --tag garazyk-linux-builder \
            .

      - name: Extract release binaries
        run: |
          container_id="$(docker create garazyk-linux-builder)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir binaries
          for target in kaszlak campagnola zuk syrena; do
            docker cp "$container_id:/src/build/bin/$target" "binaries/$target"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: binaries
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: binaries

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: linux-binaries-${{ github.run_number }}
          release_name: Linux Binaries (Build #${{ github.run_number }})
          body: |
            Linux binaries for:
            - kaszlak (PDS with AdminUI)
            - campagnola (PLC Directory)
            - zuk (Relay/BGS)
            - syrena (AppView)

            To use these binaries locally:
            ```bash
            # Download binaries
            mkdir -p docker/local-network/staging/bin
            # Download each binary and save to staging/bin/

            # Rebuild Docker images
            docker compose -f docker/local-network/docker-compose.yml build

            # Start testnet
            docker compose -f docker/local-network/docker-compose.yml up -d
            ```

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          files: binaries/*
          tag_name: linux-binaries-${{ github.run_number }}
