{{^error}}
<div class="detail-card">
<div class="detail-row"><span class="detail-label">Ephemeral addresses</span><span class="detail-value text-mono">{{ephemeralCount}}</span></div>
<div class="detail-row"><span class="detail-label">Rendezvous addresses</span><span class="detail-value text-mono">{{rendezvousCount}}</span></div>
<div class="detail-row"><span class="detail-label">Pending messages</span><span class="detail-value text-mono">{{pendingMessages}}</span></div>
<div class="detail-row"><span class="detail-label">Database size</span><span class="detail-value text-mono">{{dbSizeBytes}} bytes</span></div>
</div>
{{/error}}
{{#error}}
<div class="alert alert-warning">{{message}}</div>
{{/error}}
