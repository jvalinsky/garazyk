{{^error}}
<div class="detail-card">
<div class="detail-row"><span class="detail-label">Claims</span><span class="detail-value text-mono">{{claims}}</span></div>
<div class="detail-row"><span class="detail-label">Delivers</span><span class="detail-value text-mono">{{delivers}}</span></div>
<div class="detail-row"><span class="detail-label">Polls</span><span class="detail-value text-mono">{{polls}}</span></div>
<div class="detail-row"><span class="detail-label">Misses</span><span class="detail-value text-mono">{{misses}}</span></div>
<div class="detail-row"><span class="detail-label">Expirations</span><span class="detail-value text-mono">{{expirations}}</span></div>
<div class="detail-row"><span class="detail-label">Auth failures</span><span class="detail-value text-mono">{{authFailures}}</span></div>
