{{^error}}
<div class="metric-row">
<div class="metric"><span class="metric-label">Claims</span><span class="metric-value">{{claims}}</span></div>
<div class="metric"><span class="metric-label">Delivers</span><span class="metric-value">{{delivers}}</span></div>
<div class="metric"><span class="metric-label">Polls</span><span class="metric-value">{{polls}}</span></div>
<div class="metric"><span class="metric-label">Misses</span><span class="metric-value">{{misses}}</span></div>
<div class="metric"><span class="metric-label">Expirations</span><span class="metric-value">{{expirations}}</span></div>
<div class="metric"><span class="metric-label">Auth failures</span><span class="metric-value">{{authFailures}}</span></div>
</div>
{{/error}}
{{#error}}
<div class="alert alert-warning">{{message}}</div>
{{/error}}
