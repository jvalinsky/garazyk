<div class="cluster-grid">
{{#services}}
<div class="service-card {{statusClass}}">
<div class="service-header"><span class="service-name">{{nameUpper}}</span><span class="status-dot"></span></div>
<div class="service-url">{{url}}</div>
{{#version}}<div class="service-meta">Version: {{version}}</div>{{/version}}
{{#latency_ms}}<div class="service-meta">Latency: {{latency_ms}}ms</div>{{/latency_ms}}
{{#error}}<div class="text-xs text-destructive mt-xs">{{error}}</div>{{/error}}
</div>
{{/services}}
</div>
{{#generatedAt}}
<div class="text-xs text-secondary mt-lg">Last updated: {{generatedAt}}</div>
{{/generatedAt}}
