{{#error}}
<div class="alert alert-destructive">{{message}}</div>
{{/error}}
{{^error}}
<div id="app-passwords-result" aria-live="polite"></div><form class="form mb-lg" data-ui-form="create-app-password"><div class="form-group"><label for="create-pwd-did">DID:</label><input type="text" id="create-pwd-did" class="form-input" placeholder="Enter DID"></div><div class="form-group"><label for="create-pwd-name">Password Name:</label><input type="text" id="create-pwd-name" class="form-input" placeholder="Enter password name"></div><button type="submit" class="btn btn-primary btn-sm">Create</button></form>
<table class="table"><thead><tr><th>Name</th><th>Created</th><th>Actions</th></tr></thead><tbody>
{{#passwords}}
<tr><td>{{name}}</td><td class="text-sm">{{createdAt}}</td><td><button class="btn btn-destructive btn-sm" data-ui-action="delete-app-password" data-ui-did="{{did}}" data-ui-name="{{name}}">Delete</button></td></tr>
{{/passwords}}
</tbody></table>
{{/error}}
