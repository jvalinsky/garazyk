<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{serviceDisplayName}} — Sign in</title>
    <link rel="stylesheet" href="/css/system.css">
    <meta name="csrf-nonce" content="{{csrfNonce}}">
</head>
<body>
    <div class="login-shell">
        <main class="login-panel" aria-labelledby="login-title">
            <header class="login-header">
                <p class="login-kicker">Garazyk admin</p>
                <h1 id="login-title">{{serviceDisplayName}}</h1>
                <p class="login-subtitle">Sign in with the service admin password.</p>
            </header>
            <form id="login-form" class="login-form" data-ui-form="login">
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" class="form-input" type="password" name="password" required autocomplete="current-password" spellcheck="false" autofocus>
                </div>
                <button type="submit" class="btn btn-primary login-submit">Sign in</button>
            </form>
            <p id="error" class="login-error" role="alert"></p>
        </main>
    </div>
    <script type="module" src="/js/admin-ui.js"></script>
</body>
</html>
