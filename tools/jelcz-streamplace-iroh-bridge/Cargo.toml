[package]
name = "jelcz-streamplace-iroh-bridge"
version = "0.1.0"
edition = "2024"
license = "Unlicense OR CC0-1.0"
publish = false
description = "Receive-only, fail-closed local IPC bridge for Streamplace live iroh segments"

[lib]
path = "src/lib.rs"

[[bin]]
name = "jelcz-streamplace-iroh-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.99"
axum = "=0.8.4"
clap = { version = "=4.5.47", features = ["derive"] }
# iroh-base 0.93.2 pins ed25519-dalek 3.0.0-pre.1. Its compatible
# ed25519/PKCS#8 releases must stay on the upstream workspace resolution;
# current crates.io's newer stable pair does not compile with that pre-release.
ed25519 = "=3.0.0-rc.1"
der = "=0.8.0-rc.9"
pkcs8 = "=0.11.0-rc.7"
spki = "=0.8.0-rc.4"
signature = "=3.0.0-rc.4"
rand_core = "=0.9.3"
sha2 = "=0.11.0-rc.2"
curve25519-dalek = "=5.0.0-pre.1"
iroh = "=0.93.2"
iroh-base = "=0.93.2"
irpc = "=0.9.0"
irpc-iroh = "=0.9.0"
libc = "=0.2.189"
bytes = { version = "=1.10.1", features = ["serde"] }
postcard = { version = "=1.1.3", features = ["use-std"] }
serde = { version = "=1.0.226", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower = "=0.5.2"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }

[package.metadata.streamplace_upstream]
# Source-review / future FFI target. This is deliberately metadata, not a Cargo
# dependency: the upstream crate emits only staticlib/cdylib, and its generic
# RPC handler cannot prove remote_id/from against the authenticated connection.
repository = "https://github.com/streamplace/streamplace.git"
revision = "5ba597dbedda8f2fdb84b815ee633301212f5f51"
crate = "rust/iroh-streamplace"
workspace_lock_iroh = "0.93.2"
workspace_lock_irpc = "0.9.0"
